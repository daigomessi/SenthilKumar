<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071014">
    <title>Senthil Kumar | Resume</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            background: #071014;
            color: #f2fbfa;
            font-family: Arial, sans-serif;
        }

        header {
            min-height: 64px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(9, 24, 29, 0.92);
            border-bottom: 1px solid rgba(143, 235, 224, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 1.1rem;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 12px;
        }

        a {
            color: #72e5d3;
        }

        nav a {
            padding: 8px 12px;
            border: 1px solid rgba(143, 235, 224, 0.35);
            border-radius: 8px;
            text-decoration: none;
        }

        nav a:hover {
            background: rgba(143, 235, 224, 0.12);
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            background: #26302e;
        }

        @media (max-width: 480px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            nav {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Senthil Kumar — Resume</h1>
        <nav aria-label="Resume actions">
            <a href="../Firstpage/firstpage.html">Back to portfolio</a>
            <a href="Senthil%20Resume.pdf" download>Download PDF</a>
        </nav>
    </header>
    <iframe src="Senthil%20Resume.pdf" title="Senthil Kumar resume PDF">
        <p>Your browser cannot display the resume. <a href="Senthil%20Resume.pdf">Open the PDF</a>.</p>
    </iframe>
</body>
</html>
